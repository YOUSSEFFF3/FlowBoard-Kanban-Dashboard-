    <section class="hero">
        <div class="error-container ">
            <p class="error-message"></p>
            <button class="refresh-btn">Try again</button>
        </div>
        <form class="form-search">
            <label class="search-label">
                <input class="form-control search" type="search" placeholder="Search…">
            </label>
            <label>
                <select class="form-control filter-priorite" name="status">
                    <option value="" selected>..choose status </option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                </select>
            </label>
            <label>
                <select class="form-control select-mombers" name="status">
                    <option value="" selected>..choose </option>

                </select>
            </label>
        </form>
        <div class="cart-form hide">
            <h2 class="h2">Nouvelle cart </h2>
            <form class="creation-cart">
                <div class="tach-discript">
                    <label class="labele">
                        <span class="span">title</span>
                        <input type="text" class="form-control" name="title" requierd>
                    </label>
                    <label class="labele">
                        <span class="span">description</span>
                        <textarea name="description" class="form-control" requierd></textarea>
                    </label>
                </div>
                <div>
                    <label class="labelee">
                        <span class="span">status</span>
                        <select class="form-control" name="status">
                            <option selected>..choose</option>
                            <option value="in-progress">in-progress</option>
                            <option value="todo">todo</option>
                            <option value="done">done</option>
                        </select>
                    </label>
                    <!-- "high" medium low  -->
                    <label class="labele">
                        <span class="span">priority</span>
                        <select class="form-control" name="priority">
                            <option selected>..choose</option>
                            <option value="low">low</option>
                            <option value="medium">medium</option>
                            <option value="high">high</option>
                        </select>
                    </label>
                </div>
                <label class="labele">
                    <span class="span">assignee</span>
                    <select name="assignee" class="form-control" id="select-assigne"></select>
                </label>
                <!-- dueDate -->
                <label class="labele">
                    <span class="span">dueDate</span>
                    <input type="date" class="form-control" name="date" required>
                </label>
                <div class="form-button">
                    <button type="submit" class="btn-subtle theme-success">Submit</button>
                    <button type="button" class="btn-subtle theme-primary return">return</button>
                </div>
            </form>
        </div>
    </section>
    <section class="les-taches">
        <!-- <div class="cart-statuuus">
             <h1>TO DO</h1>
        </div> -->

            </div>
        </div>
        <div>
            <h1>DONE</h1>
            <div class="cart-3">

            </div>
        </div>
    </section>
