    <section class="hero">
        <form class="form-search">
            <label class="search-label">
                <input class="form-control" type="search" name="" id="" placeholder="Search…">
            </label>
            <label for="filtre">Pick your filtere type:</label>       
        </form>
        <div class="cart-form hide">
            <h2 class="h2">Nouvelle cart </h2>
            <form class="creation-cart">
                <div class="tach-discript">
                    <label class="label">
                        <span class="span">title</span>
                        <input type="text" name="" id="">
                    </label>
                    <label class="label">
                        <span class="span">description</span>
                        <textarea name="disc" id=""></textarea>
                    </label>
                </div>
                <div>
                    <label class="label">
                        <span class="span">status</span>
                        <select>
                            <option value="1" selected>..choose</option>
                            <option value="2">in-progress</option>
                            <option value="3">todo</option>
                            <option value="3">done</option>
                        </select>
                    </label>
                    <!-- "high" medium low  -->
                    <label class="label">
                        <span class="span">priority</span>
                        <select>
                            <option value="1" selected>..choose</option>
                            <option value="2">low</option>
                            <option value="3">medium</option>
                            <option value="3">high</option>
                        </select>
                    </label>
                </div>
                <label class="label">
                    <span class="span">assignee</span>
                    <input type="text" name="" id="">
                </label>
                <!-- dueDate -->
                <label class="label">
                    <span class="span">dueDate</span>
                    <input type="date">
                </label>

            </form>
        </div>
    </section>
    <section class="les-taches">
        <div class="cart-statuuus">
        </div>
        <div class="cart-1">
            <h1>TO DO</h1>

        <div class="cart-2">

        </div>
        <div class="cart-3">
            <h1>DONE</h1>
